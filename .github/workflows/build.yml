name: Build

on:
  push:
    branches: master
  pull_request:
    branches: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install node
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: 'x64'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'jupyterlab>=4,<5'
    - name: Install JavaScript dependencies
      run: |
        jlpm
    - name: Lint
      run: |
        jlpm run lint:check
    - name: Install extension
      run: |
        python -m pip install .
    - name: Check labextension
      run: |
        jupyter labextension list 2>&1 | grep -ie "@jupyterlab-contrib/spellchecker.*OK"
    - name: Browser smoke test
      run: |
        python -m jupyterlab.browser_check
    - name: Install test dependencies
      run: python -m pip install pytest
    - name: Run python tests
      run: |
        python -m pytest

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "jupyterlab-spellchecker" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v7
      with:
        name: extension-artifacts
        path: dist/jupyterlab_spellchecker*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: 'x64'
    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" jupyterlab_spellchecker*.whl

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "@jupyterlab-contrib/spellchecker.*OK"
        python -m jupyterlab.browser_check --no-browser-test
